# Compose 文件版本由 Docker Compose V2 自动识别，此处不声明 version 以避免兼容性警告。
services:
  # MySQL 服务用于本地开发和集成测试验证，生产环境应使用独立托管数据库。
  mysql:
    # image 指定 MySQL 运行镜像版本，保持与项目数据库技术栈一致。
    image: mysql:8.4
    # container_name 指定本地容器名称，便于开发时识别服务。
    container_name: cooperation-mysql
    environment:
      # MYSQL_DATABASE 指定系统默认数据库名称，建议保持与后端配置一致。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cooperation}
      # MYSQL_USER 指定业务数据库用户，不应使用 root 账号运行应用。
      MYSQL_USER: ${MYSQL_USER:-cooperation_user}
      # MYSQL_PASSWORD 指定业务数据库密码，本地可用示例值，真实部署必须从安全环境变量注入。
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      # MYSQL_ROOT_PASSWORD 指定 root 密码，仅供容器初始化使用，真实部署必须替换。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    ports:
      # 左侧端口可通过 MYSQL_PORT 调整，右侧 3306 为容器内 MySQL 默认端口。
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 数据卷保存 MySQL 数据，避免容器重启后丢失。
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 健康检查用于等待数据库可连接后再启动依赖服务。
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端服务占位，镜像构建依赖后续 Dockerfile 任务补充。
  backend:
    # build.context 指向 Spring Boot 后端工程目录，后续由后端 Dockerfile 补充镜像构建细节。
    build:
      context: ./backend
    # container_name 指定后端容器名称，便于查看日志和定位服务。
    container_name: cooperation-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # SPRING_PROFILES_ACTIVE 指定后端运行环境，local 用于本地开发。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # SERVER_PORT 指定后端 HTTP 端口。
      SERVER_PORT: ${BACKEND_PORT:-8080}
      # SPRING_DATASOURCE_URL 指定后端连接 Compose 内 MySQL 服务的 JDBC 地址。
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/cooperation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      # SPRING_DATASOURCE_USERNAME 指定业务数据库用户，应与 MYSQL_USER 保持一致。
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cooperation_user}
      # SPRING_DATASOURCE_PASSWORD 指定业务数据库密码，仅使用占位值，真实部署必须从安全环境变量注入。
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      # APP_FILE_STORAGE_ROOT 指定本地文件存储根目录，所有业务文件都应限制在该目录内。
      APP_FILE_STORAGE_ROOT: ${APP_FILE_STORAGE_ROOT:-/data/cooperation}
      # APP_AES_KEY 指定 SMTP 密码加密密钥，生产环境必须替换为 64 位十六进制随机值。
      APP_AES_KEY: ${APP_AES_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # MAIL_ENABLED 指定是否启用真实 SMTP 邮件发送，未配置时发送接口会明确返回失败。
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      # MAIL_HOST 指定 SMTP 服务地址，例如 smtp.qq.com 或企业邮箱 SMTP 地址。
      MAIL_HOST: ${MAIL_HOST:-}
      # MAIL_PORT 指定 SMTP 端口，SSL 常用 465，STARTTLS 常用 587。
      MAIL_PORT: ${MAIL_PORT:-465}
      # MAIL_USERNAME 指定 SMTP 登录账号，通常为发件邮箱。
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      # MAIL_PASSWORD 指定 SMTP 授权码或密码，真实部署必须从安全环境变量注入。
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # MAIL_FROM 指定发件人邮箱，通常与 MAIL_USERNAME 保持一致。
      MAIL_FROM: ${MAIL_FROM:-}
      # MAIL_SSL_ENABLED 指定是否启用 SSL 直连模式，端口 465 通常为 true。
      MAIL_SSL_ENABLED: ${MAIL_SSL_ENABLED:-true}
      # MAIL_STARTTLS_ENABLED 指定是否启用 STARTTLS，端口 587 通常为 true。
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
    ports:
      # 左侧端口可通过 BACKEND_PORT 调整，右侧端口需与 SERVER_PORT 一致。
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      # 文件存储卷只挂载到后端，避免前端直接访问真实存储路径。
      - file-storage:/data/cooperation

  # 前端服务占位，镜像构建依赖后续 Dockerfile 任务补充。
  frontend:
    # build.context 指向 Vue 3 + Vite 前端工程目录，后续由前端 Dockerfile 补充镜像构建细节。
    build:
      context: ./frontend
      args:
        # VITE_API_BASE_URL 会在前端构建阶段写入产物，浏览器运行时直接读取。
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    # container_name 指定前端容器名称，便于开发时识别服务。
    container_name: cooperation-frontend
    environment:
      # VITE_API_BASE_URL 指定浏览器访问后端接口的基础地址。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    ports:
      # 左侧端口可通过 FRONTEND_PORT 调整，右侧 5173 为 Vite 默认预览端口。
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  # mysql-data 保存本地数据库数据。
  mysql-data:
  # file-storage 保存上传文件、回收站文件和最终压缩包。
  file-storage:
